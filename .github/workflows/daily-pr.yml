name: Daily Pull Request

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create daily branch
        run: |
          BRANCH="daily-update-$(date -u '+%Y-%m-%d')"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Make daily change
        run: |
          mkdir -p pr-activity
          echo "Automated PR activity - $(date -u '+%Y-%m-%d')" >> "pr-activity/daily.log"

      - name: Commit change
        run: |
          git config user.name "RejishJ"
          git config user.email "180749225+RejishJ@users.noreply.github.com"

          git add pr-activity/daily.log
          git commit -m "chore: daily PR activity"

      - name: Push branch
        run: |
          git push origin "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Daily PR - $(date -u '+%Y-%m-%d')" \
            --body "Automated daily development update."
