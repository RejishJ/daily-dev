name: Daily Contribution Scheduler

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-contribution-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "RejishJ"
          git config user.email "180749225+RejishJ@users.noreply.github.com"

      - name: Run daily scheduler
        id: scheduler
        run: |
          #!/bin/bash
          set -euo pipefail

          # Current UTC date and time
          TODAY=$(date -u '+%Y-%m-%d')
          CURRENT_HOUR=$(date -u '+%-H')
          CURRENT_MIN=$(date -u '+%-M')
          CURRENT_SEC=$(date -u '+%-S')

          # Determine current 2-hour slot from UTC time
          # Slots: 00:00, 02:00, 04:00, ..., 22:00
          SLOT_IDX=$((CURRENT_HOUR / 2))
          SLOT_NUM=$((SLOT_IDX * 2))
          SLOT="$(printf '%02d:00' $SLOT_NUM)"

          # --- Determine yesterday's date for rollover handling ---
          # If we're in the first 2-hour slot of the new day (hour 0 or 1),
          # we need to also check yesterday's plan for missed slots
          IS_MIDNIGHT_RUN=false
          if [ "$CURRENT_HOUR" -le 1 ]; then
            IS_MIDNIGHT_RUN=true
          fi

          YESTERDAY=$(date -u '+%Y-%m-%d' -d '1 day ago')

          # Generate deterministic plan from SHA256 of UTC date (today)
          HASH_HEX=$(echo -n "$TODAY" | sha256sum | cut -c1-8)
          HASH_INT=$((16#$HASH_HEX))
          COUNT=$((HASH_INT % 7))

          # Generate deterministic plan from SHA256 of yesterday's UTC date (for rollover)
          Y_HASH_HEX=$(echo -n "$YESTERDAY" | sha256sum | cut -c1-8)
          Y_HASH_INT=$((16#$Y_HASH_HEX))
          Y_COUNT=$((Y_HASH_INT % 7))

          # All 12 possible 2-hour slots
          ALL_SLOTS=("00:00" "02:00" "04:00" "06:00" "08:00" "10:00"
                     "12:00" "14:00" "16:00" "18:00" "20:00" "22:00")

          # Select COUNT distinct slots deterministically for today
          # Using (hash + i*7) % 12; since gcd(7,12)=1, this gives N unique values
          TODAY_SELECTED=()
          for ((i=0; i<COUNT; i++)); do
            INDEX=$(( (HASH_INT + i * 7) % 12 ))
            TODAY_SELECTED+=("${ALL_SLOTS[$INDEX]}")
          done

          # Select Y_COUNT distinct slots deterministically for yesterday
          YESTERDAY_SELECTED=()
          for ((i=0; i<Y_COUNT; i++)); do
            Y_INDEX=$(( (Y_HASH_INT + i * 7) % 12 ))
            YESTERDAY_SELECTED+=("${ALL_SLOTS[$Y_INDEX]}")
          done

          # --- Idempotency check for today's slots ---
          # Look for existing entries for today's selected slots in daily.log
          TODAY_ALREADY_DONE=false
          if [ -f activity/daily.log ] && grep -q "^${TODAY}T" activity/daily.log; then
            # Count existing entries for today
            TODAY_EXISTING=$(grep -c "^${TODAY}T" activity/daily.log 2>/dev/null || echo 0)
            if [ "$TODAY_EXISTING" -ge "$COUNT" ]; then
              TODAY_ALREADY_DONE=true
            fi
          fi

          # --- Handle missed slots from yesterday (midnight rollover) ---
          YESTERDAY_MISSED=()
          if [ "$IS_MIDNIGHT_RUN" = true ]; then
            # Check which yesterday selected slots were not yet committed
            for yslot in "${YESTERDAY_SELECTED[@]}"; do
              if [ -f activity/daily.log ] && grep -q "scheduled slot ${yslot}" activity/daily.log 2>/dev/null; then
                : # already committed
              else
                YESTERDAY_MISSED+=("$yslot")
              fi
            done
          fi

          # Make commits for missed yesterday slots (if any)
          # These use the CURRENT execution time (today's slot time)
          for yslot in "${YESTERDAY_MISSED[@]}"; do
            # Determine contribution number for this slot
            # by counting existing entries for yesterday
            Y_EXISTING=0
            if [ -f activity/daily.log ]; then
              Y_EXISTING=$(grep -c "^${YESTERDAY}T" activity/daily.log 2>/dev/null || echo 0)
            fi
            Y_NUM=$((Y_EXISTING + 1))

            # Append to daily.log: YYYY-MM-DDTHH:MM:SSZ | contribution #N | scheduled slot HH:MM
            # Use CURRENT time for the timestamp (not yesterday's time)
            TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            echo "${TODAY}T${TS} | contribution #${Y_NUM} | scheduled slot ${yslot}" >> activity/daily.log

            # Select commit message deterministically from today's date + slot
            # This ensures the message is consistent
            MIXED=$(echo -n "${TODAY}${yslot}" | sha256sum | cut -c1-8)
            MIXED_INT=$((16#$MIXED))
            IDX=$((MIXED_INT % 5))

            case "$IDX" in
              0) MSG="chore: update daily activity" ;;
              1) MSG="chore: record scheduled activity" ;;
              2) MSG="chore: update activity log" ;;
              3) MSG="chore: record contribution activity" ;;
              4) MSG="chore: maintain daily activity log" ;;
            esac

            # Commit the missed yesterday slot
            git add activity/daily.log
            if ! git diff --staged --quiet; then
              git commit -m "$MSG"
              git push origin main
            fi
          done

          # --- If today already fully done, skip ---
          if [ "$TODAY_ALREADY_DONE" = true ]; then
            exit 0
          fi

          # --- If current slot is not selected for today, skip ---
          IS_SELECTED=false
          for s in "${TODAY_SELECTED[@]}"; do
            if [ "$s" = "$SLOT" ]; then
              IS_SELECTED=true
              break
            fi
          done

          if [ "$IS_SELECTED" = false ]; then
            exit 0
          fi

          # --- Make contribution commit for current slot ---
          # Determine contribution number: count existing entries for today
          EXISTING=0
          if [ -f activity/daily.log ]; then
            EXISTING=$(grep -c "^${TODAY}T" activity/daily.log 2>/dev/null || echo 0)
          fi
          NUM=$((EXISTING + 1))

          # Append to daily.log: YYYY-MM-DDTHH:MM:SSZ | contribution #N | scheduled slot HH:MM
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "${TODAY}T${TS} | contribution #${NUM} | scheduled slot ${SLOT}" >> activity/daily.log

          # Select commit message deterministically from date + slot
          MIXED=$(echo -n "${TODAY}${SLOT}" | sha256sum | cut -c1-8)
          MIXED_INT=$((16#$MIXED))
          IDX=$((MIXED_INT % 5))

          case "$IDX" in
            0) MSG="chore: update daily activity" ;;
            1) MSG="chore: record scheduled activity" ;;
            2) MSG="chore: update activity log" ;;
            3) MSG="chore: record contribution activity" ;;
            4) MSG="chore: maintain daily activity log" ;;
          esac

          # Commit if there are staged changes
          git add activity/daily.log
          if ! git diff --staged --quiet; then
            git commit -m "$MSG"
            git push origin main
          fi

          exit 0
