name: Professional Activity Simulator

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  activity:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set git identity
        run: |
          git config user.name "RejishJ"
          git config user.email "180749225+RejishJ@users.noreply.github.com"

      - name: Generate realistic pro activity
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          #!/bin/bash
          set -euo pipefail

          TODAY=$(date -u '+%Y-%m-%d')
          DAY_OF_WEEK=$(date -u '+%w')

          HASH=$(echo -n "$TODAY" | sha256sum | cut -c1-16)
          SEED=$((16#${HASH:0:8}))
          ACTIVITY_TYPE=$((SEED % 100))

          if [ "$DAY_OF_WEEK" -eq 0 ]; then
            SUNDAY_CHANCE=$((SEED % 100))
            if [ "$SUNDAY_CHANCE" -lt 60 ]; then
              echo "Sunday rest day"
              exit 0
            fi
          fi

          mkdir -p activity

          if [ "$ACTIVITY_TYPE" -lt 65 ]; then
            COMMITS=$((3 + (SEED % 9)))
            for ((i=1; i<=COMMITS; i++)); do
              TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
              echo "$TIMESTAMP | Commit #$i" >> activity/daily.log
            done
            git add activity/daily.log
            git commit -m "feat: daily development work" || true
            git push origin main || true

          elif [ "$ACTIVITY_TYPE" -lt 80 ]; then
            git checkout -b "feature/improvement-$TODAY" 2>/dev/null || git checkout "feature/improvement-$TODAY"
            echo "PR work $(date)" >> activity/daily.log
            git add activity/daily.log
            git commit -m "refactor: code improvements" || true
            git push origin "feature/improvement-$TODAY" -f || true
            gh pr create --title "Improvement: $TODAY" --body "Code refactoring and optimization." --base main 2>/dev/null || echo "PR exists"

          elif [ "$ACTIVITY_TYPE" -lt 92 ]; then
            gh issue create --title "Feature: Add caching mechanism" --body "Automated issue." --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "Issue exists"
            gh issue create --title "Bug: Performance issue" --body "Automated bug report." --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "Issue exists"
            git add activity/daily.log 2>/dev/null || true
            git commit -m "docs: issue tracking" || true
            git push origin main || true

          else
            echo "Code review session $(date)" >> activity/daily.log
            git add activity/daily.log
            git commit -m "review: code review documentation" || true
            git push origin main || true
          fi

          echo "Activity complete"
          exit 0
