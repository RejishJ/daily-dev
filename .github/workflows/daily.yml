name: Daily Dev Update

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update daily file
        run: |
          mkdir -p activity
          echo "Daily development activity - $(date -u '+%Y-%m-%d')" >> activity/daily.log

      - name: Commit changes
        run: |
          git config user.name "RejishJ"
          git config user.email "180749225+RejishJ@users.noreply.github.com"

          git add activity/daily.log
          git commit -m "chore: daily development activity" || echo "Nothing to commit"

          git pull --rebase origin main
          git push origin main
